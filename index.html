<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm Signature</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: rgba(0,0,0,0.4);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .modal {
      background: white;
      width: 650px;
      max-width: 100%;
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.3);
      text-align: left;
      box-sizing: border-box;
    }
    h2 { margin-top: 0; font-size: 20px; }
    .terms-text { margin-top: 12px; font-size: 13px; line-height: 1.6; color: #333; white-space: pre-wrap; max-height: 260px; overflow:auto; }
    .label-text { font-size: 15px; margin-bottom: 8px; display: block; margin-top: 15px; }
    .signature-box {
      border: 2px solid #ccc; border-radius: 6px; width: 100%; height: 120px;
      background: #fafafa; cursor: text; padding: 10px; overflow: hidden;
      position: relative; box-sizing: border-box;
    }
    #signatureText {
      width: 100%; height: 100%; border: none; outline: none; resize: none;
      font-size: 38px; font-family: "Pacifico", cursive; color: #555; background: transparent;
    }
    #drawCanvas {
      width: 100%; height: 120px; display: none; border: 2px solid #ccc;
      border-radius: 6px; background: #fafafa; box-sizing: border-box; touch-action: none;
    }
    .small-note { margin-top: 10px; font-size: 13px; color: #444; display: flex; align-items: center; gap: 6px; }
    .checkbox-error, .name-error { margin-top: 6px; font-size: 12px; color: #d93025; display: none; }
    .btn-row { margin-top: 20px; text-align: right; }
    button {
      padding: 8px 16px; font-size: 15px; border-radius: 6px; cursor: pointer;
      border: none; display: inline-flex; align-items: center; gap: 8px;
    }
    .cancel-btn { background: #e0e0e0; margin-right: 10px; }
    .accept-btn { background: #64c832; color: white; }
    .accept-btn:disabled { opacity: 0.7; cursor: not-allowed; }
    .switch-mode { font-size: 13px; margin-top: 6px; cursor: pointer; color: #0073ff; text-decoration: underline; display:inline-block; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.5); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success-box { text-align: center; padding: 40px 20px; }
    .success-box h2 { color: #64c832; margin-bottom: 10px; }
    .success-box p { font-size: 15px; color: #444; }
    .error-box { color: #d93025; font-size: 13px; margin-top: 10px; }
  </style>
</head>

<body>

<div class="modal" id="modal">
  <h2>Confirm Your Acceptance</h2>

  <div id="termsText" class="terms-text"></div>

  <div id="apiError" class="error-box" style="display:none;"></div>

  <label class="label-text">Please sign your name:</label>

  <div class="signature-box" id="typeModeBox">
    <textarea id="signatureText" placeholder="your name"></textarea>
  </div>

  <div class="name-error" id="nameError">Please enter only your first name.</div>

  <canvas id="drawCanvas"></canvas>

  <div class="switch-mode" id="switchMode">Switch to draw signature</div>

  <p class="small-note">
    <input type="checkbox" id="acceptTermsCheckbox" />
    I understand and agree to this being an electronic representation of my signature.
  </p>

  <div class="checkbox-error" id="checkboxError">Please confirm by checking this box before continuing.</div>

  <div class="btn-row">
    <button class="cancel-btn" id="cancelBtn">Cancel</button>
    <button class="accept-btn" id="acceptBtn"><span id="btnText">Complete Signature</span></button>
  </div>
</div>

<script>
  // ---- Backend base ----
  const API_BASE = "https://signature-backend-one.vercel.app";
  // ----------------------

  let drawMode = false;

  const switchBtn = document.getElementById("switchMode");
  const textBox = document.getElementById("signatureText");
  const typeBox = document.getElementById("typeModeBox");
  const canvas = document.getElementById("drawCanvas");
  const ctx = canvas.getContext("2d");
  const modal = document.getElementById("modal");
  const termsText = document.getElementById("termsText");
  const acceptBtn = document.getElementById("acceptBtn");
  const btnText = document.getElementById("btnText");
  const checkbox = document.getElementById("acceptTermsCheckbox");
  const checkboxError = document.getElementById("checkboxError");
  const nameError = document.getElementById("nameError");
  const apiError = document.getElementById("apiError");
  const cancelBtn = document.getElementById("cancelBtn");

  let sessionType = null;   // "terms" | "doc"
  let clientName = null;
  let hasDrawn = false;

  function getKeyFromURL() {
    return new URLSearchParams(window.location.search).get("k");
  }

  // ---- signature pad: crisp + mouse & touch ----
  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const w = rect.width || typeBox.clientWidth || 400;
    const h = 120;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#000";
  }

  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }

  let drawing = false;
  function startDraw(e) {
    drawing = true; hasDrawn = true;
    const { x, y } = pointerPos(e);
    ctx.beginPath();
    ctx.moveTo(x, y);
    if (e.cancelable) e.preventDefault();
  }
  function moveDraw(e) {
    if (!drawing) return;
    const { x, y } = pointerPos(e);
    ctx.lineTo(x, y);
    ctx.stroke();
    if (e.cancelable) e.preventDefault();
  }
  function endDraw() { drawing = false; }

  canvas.addEventListener("mousedown", startDraw);
  canvas.addEventListener("mousemove", moveDraw);
  window.addEventListener("mouseup", endDraw);
  canvas.addEventListener("touchstart", startDraw, { passive: false });
  canvas.addEventListener("touchmove", moveDraw, { passive: false });
  canvas.addEventListener("touchend", endDraw);

  switchBtn.onclick = () => {
    drawMode = !drawMode;
    if (drawMode) {
      typeBox.style.display = "none";
      canvas.style.display = "block";
      switchBtn.textContent = "Switch to typed signature";
      resizeCanvas(); // size it now that it's visible
    } else {
      canvas.style.display = "none";
      typeBox.style.display = "block";
      switchBtn.textContent = "Switch to draw signature";
    }
  };

  window.addEventListener("resize", () => { if (drawMode) resizeCanvas(); });

  // ---- load session ----
  async function loadInitialData() {
    const key = getKeyFromURL();
    if (!key) {
      apiError.style.display = "block";
      apiError.innerText = "Invalid or missing access key.";
      acceptBtn.disabled = true;
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/get-session?k=${encodeURIComponent(key)}`);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();

      if (!data || !data.type) throw new Error("Invalid response");

      sessionType = data.type;
      clientName = data.clientName || "";

      if (data.signatureStatus === "done") {
        showAlreadySigned();
        return;
      }

      if (clientName) {
        textBox.value = clientName.trim().split(" ")[0];
      }

      if (sessionType === "terms") {
        termsText.innerText = data.termsText || "";
      } else {
        termsText.style.display = "none";
      }
    } catch (e) {
      apiError.style.display = "block";
      apiError.innerText = "Failed to load required data. Please try again later.";
      acceptBtn.disabled = true;
    }
  }

  loadInitialData();

  // keep the typed signature to a single first name (existing behaviour)
  textBox.addEventListener("input", () => {
    const value = textBox.value.trim();
    if (value.includes(" ")) {
      nameError.style.display = "block";
      textBox.value = value.split(" ")[0];
    } else {
      nameError.style.display = "none";
    }
  });

  checkbox.addEventListener("change", () => {
    if (checkbox.checked) checkboxError.style.display = "none";
  });

  cancelBtn.addEventListener("click", () => {
    try { window.close(); } catch (e) {}
  });

  // render the typed name to a PNG, only after the font is ready
  // Wait until the Pacifico webfont is genuinely loaded before drawing the
  // signature. If we draw too early, the canvas falls back to a heavier system
  // cursive font and the saved signature looks bold. Polling document.fonts
  // (and re-triggering the load) handles the case where the stylesheet hasn't
  // registered the font yet.
  function whenPacificoReady(timeoutMs) {
    return new Promise(function (resolve) {
      var start = Date.now();
      (function tick() {
        try {
          if (document.fonts && document.fonts.check('normal 400 38px "Pacifico"')) return resolve(true);
          if (document.fonts && document.fonts.load) document.fonts.load('normal 400 38px "Pacifico"');
        } catch (e) {}
        if (Date.now() - start > (timeoutMs || 4000)) return resolve(false);
        setTimeout(tick, 150);
      })();
    });
  }
  whenPacificoReady(4000); // start loading immediately on page load

  async function typedSignatureToBase64(text) {
    await whenPacificoReady(4000);

    const scale = 4, padding = 24, height = 120;
    const font = 'normal 400 38px "Pacifico", cursive';
    const measure = document.createElement("canvas").getContext("2d");
    measure.font = font;
    const textWidth = measure.measureText(text).width;
    const logicalWidth = Math.ceil(textWidth + padding * 2);

    const tmp = document.createElement("canvas");
    tmp.width = logicalWidth * scale;
    tmp.height = height * scale;
    const t = tmp.getContext("2d");
    t.scale(scale, scale);
    t.imageSmoothingEnabled = true;
    t.imageSmoothingQuality = "high";
    t.clearRect(0, 0, logicalWidth, height);
    t.font = font;
    t.fillStyle = "#000";
    t.textAlign = "left";
    t.textBaseline = "middle";
    t.fillText(text, padding, height / 2);
    return tmp.toDataURL("image/png");
  }

  function showSuccess() {
    modal.innerHTML = `
      <div class="success-box">
        <h2>Signature Captured</h2>
        <p>Your signature has been successfully recorded.</p>
      </div>`;
  }
  function showAlreadySigned() {
    modal.innerHTML = `
      <div class="success-box">
        <h2>Signature Already Captured</h2>
        <p>This link has already been signed. If you believe this is an error, please contact us.</p>
      </div>`;
  }
  function fail(message) {
    apiError.style.display = "block";
    apiError.innerText = message;
    acceptBtn.disabled = false;
    btnText.innerText = "Complete Signature";
  }

  acceptBtn.onclick = async () => {
    apiError.style.display = "none";

    if (!checkbox.checked) { checkboxError.style.display = "block"; return; }
    if (drawMode && !hasDrawn) { fail("Please draw your signature before continuing."); return; }
    if (!drawMode && textBox.value.trim() === "") { fail("Please enter your name before continuing."); return; }

    const key = getKeyFromURL();
    if (!key) { fail("Invalid or missing access key."); return; }

    acceptBtn.disabled = true;
    btnText.innerHTML = `<span class="spinner"></span> Processing...`;

    let signatureBase64;
    try {
      signatureBase64 = drawMode
        ? canvas.toDataURL("image/png")
        : await typedSignatureToBase64(textBox.value.trim());
    } catch (e) {
      fail("Could not read the signature. Please try again.");
      return;
    }

    // ---- single authoritative call ----
    try {
      const res = await fetch(`${API_BASE}/api/sign`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key, signature: signatureBase64 })
      });

      if (res.ok) { showSuccess(); return; }

      let data = {};
      try { data = await res.json(); } catch (e) {}

      if (res.status === 409 && data.error === "already_signed") {
        showAlreadySigned();
      } else if (res.status === 409 && data.error === "in_progress") {
        fail("This signature is already being processed. Please wait a moment and try again.");
      } else {
        fail(data.message || "Signature submission failed. Please try again.");
      }
    } catch (error) {
      fail("Signature submission failed. Please try again.");
    }
  };
</script>

</body>
</html>
